<div class="form form--search">
  <form>
    <label class="label" for="search">Search term:</label>
    <input class="input" id="search" type="search" placeholder="e.g. the discriminant" autocomplete="off" />

    <ul class="list list--results" id="list">
        <!-- results go here -->
    </ul>
  </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const field = document.querySelector('#search');
    const resultsList = document.querySelector('#list');
    resultsList.innerHTML = '';
    const content = document.querySelector('.content');

    // Collect links, excluding the results list itself.
    const list_items = Array.from(content.querySelectorAll('li a'))
      .filter(link => !resultsList.contains(link));

    const MAX_RESULTS = 3;

    field.addEventListener('input', () => {
      const query = field.value.trim().toLowerCase();
      resultsList.innerHTML = '';
      if (!query) return;

      const matches = list_items.filter(link =>
        link.textContent.toLowerCase().includes(query)
      );

      if (matches.length === 0) {
        resultsList.innerHTML = '<li>No matches found.</li>';
        return;
      }

      matches.slice(0, MAX_RESULTS).forEach(link => {
        const li = document.createElement('li');
        const a = document.createElement('a');

        a.href = link.getAttribute('href');
        a.textContent = link.textContent;

        li.appendChild(a);
        resultsList.appendChild(li);
      });

      if (matches.length > MAX_RESULTS) {
        const li = document.createElement('li');
        li.textContent = `…and ${matches.length - MAX_RESULTS} more.`;
        resultsList.appendChild(li);
      }
    });

    field.addEventListener('keydown', e => {
      // Prevents enter from submitting a search and reloading the page.
      if (e.key === 'Enter') e.preventDefault();
    });
  });
</script>

<noscript>Please enable JavaScript to use the search form.</noscript>
